{{ define "header" }}
<header class="subpage-header">
  <div class="nav-container">
    <a href="/" class="nav-brand">
      <img src="/img/logo.svg" alt="ZISK" class="nav-logo">
      <span class="nav-brand-text">ZISK</span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Přepnout navigaci">
    <label for="nav-toggle" class="nav-hamburger">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <div class="nav-links">
      <a href="/#casova-osa" class="nav-link">časová osa</a>
      <a href="/#o-nas" class="nav-link">o nás</a>
      <a href="{{ .Site.Params.discord_url }}" class="nav-link nav-link-highlight" target="_blank" rel="noopener">discord</a>
      <a href="/memes/" class="nav-link {{ if eq .Section "memes" }}active{{ end }}">memes</a>
      <a href="https://seminar.zisk-go.com/" class="nav-link nav-link-seminar {{ if eq .Section "seminar" }}active{{ end }}">seminář</a>
    </div>
  </div>
</header>
{{ end }}

{{ define "main" }}
<div class="page-container">
  <header class="page-head">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Description }}
    <p class="page-lead">{{ . }}</p>
    {{ end }}
  </header>

  <div class="page-content">
    {{ .Content }}

    <div class="posts-list">
      {{ range .Pages }}
      <div class="list-item-card">
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <p>{{ .Summary }}</p>
        <a href="{{ .RelPermalink }}" class="read-more">Číst dále &rarr;</a>
      </div>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
