- title: "Itálie 2024"
  date: "Listopad 2024"
  status: "blue"
  status_label: "Proběhlo"
  location: "Villaverla, Itálie"
  short_desc: "Během výletu jsme poznali několik měst, navštívili Padovskou univerzitu a zkusili si, jaké to je péct pizzu v kamenné peci, vyrábět mozzarellu a připravit si domácí těstoviny. Během toho jsme bojovali s těstem, které nás chtělo pohltit."
  photo: "/img/events/mleko.jpg"

