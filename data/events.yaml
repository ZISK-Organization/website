- title: "Česko 2022"
  date: "Březen 2022"
  status: "blue"
  status_label: "Proběhlo"
  location: "Růžená, Česko"
  short_desc: "Naše první víkendovka. Bydleli jsme na chatě na Vysočině, kde jsme hráli hry, např bombu, zkusili si virtuální realitu, hráli si s elektronikou a dělali chemické pokusy. Seznamovali jsme se s teorií kategorií a bojovali proti viru imperativního programování."
  photo: "/img/events/cesko.png"
