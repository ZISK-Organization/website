- title: "Finsko 2026"
  country: "fi"
  date: "Říjen 2026"
  status: "green"
  status_label: "Probíhá"
  location: "Forssa, Finsko"
  short_desc: "První den jsme se vydali do Helsinek, kde jsme navštívili vojenský ostrov Suomenlinna. Druhý den jsme se přesunuli do Tampere, kde jsme navštívili univerzitu a atomový kryt. Poté jsme bojovali se Skandinávskou plísní, navštívili muzeum textilu, potkali hodně Jacků a ochutnali Surströmming."
  photo: "/img/events/finsko.jpg"

- title: "Bulharsko 2026"
  country: "bg"
  date: "Květen 2026"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Balchik, Bulharsko"
  short_desc: "Pobývali jsme ve ville kousek od moře, kde jsme se však příliš nekoupali kvůli počasí. Místo toho jsme testovali šifry na Aquacoin, pořádali volby, v nichž těsně zvítězil Zlobimír Užborbón, čarovali a vařili rýži v pračce. Na závěr jsme se vykoupali v moři ve Varně a dali si luxusní oběd."
  photo: "/img/events/bulharsko.jpg"

- title: "Polsko 2025"
  country: "pl"
  date: "Listopad 2025"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Wieprz, Polsko"
  short_desc: "Vyrazili jsme do polských Beskyd, kde jsme zjistili, že je tam pořád smog. Ústředním motivem byly experimenty s ohněm na různé způsoby, od pečení crema catalana, přes hořící těstoviny a marshmallows, až po dělání popcornu. Během toho jsme se učili, jak vyrobit Molotovův koktejl a provedli jsme páté dělení Polska."
  photo: "/img/events/polsko.jpg"

- title: "Slovensko 2025"
  country: "sk"
  date: " Červenec 2025"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Sklené Teplice, Slovensko"
  short_desc: "Během víkendovky jsme se vydali do Sklených Teplic, kde jsme řešili šifrovačku, navštívili jsme baně, pohlédli si výrobu sýra, kde jsme ochutnali místní sýry a také jsme si užili koupání v termálních lázních. Dále jsme se vydali na výlet do Banské Štiavnice, kde jsme si prohlédli město a jeho okolí."
  photo: "/img/events/hrad.jpg"

- title: "Švédsko 2025"
  country: "se"
  date: "Duben 2025"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Nordkroken, Švédsko"
  short_desc: "Na počátku cesty jsme navštívili Göteborg, kde jsme si prohlédli město. Následně jsme se přesunuli do Nordkrokenu, kde jsme bydleli v chatě u jezera. Během pobytu jsme dělali slalom v lodičkách, pájeli jsme detektor kovů, vyrazili k vodopádu a snědli fakt hodně lékořice."
  photo: "/img/events/strom.jpg"

- title: "Itálie 2024"
  country: "it"
  date: "Listopad 2024"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Villaverla, Itálie"
  short_desc: "Během výletu jsme poznali několik měst, navštívili Padovskou univerzitu a zkusili si, jaké to je péct pizzu v kamenné peci, vyrábět mozzarellu a připravit si domácí těstoviny. Během toho jsme bojovali s těstem, které nás chtělo pohltit."
  photo: "/img/events/mleko.jpg"

- title: "Slovensko 2024"
  country: "sk"
  date: "Červenec 2024"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Dedinky, Slovensko"
  short_desc: "Tato víkendovka byla postavená na principu orgování naruby. Tedy organizátoři ZISKu se stali účastníky a program pro ně připravili účastníci. Během pobytu jsme připravovali vafle tenisovou raketou, měli jsme výsadek v lese a navštívili Košice i Tatry. Také jsme si užili šifrovačku po Slovenském ráji a dali si vodní bitvu."
  photo: "/img/events/vafle.jpg"

- title: "Česko 2024"
  country: "cz"
  date: "Duben 2024"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Čížov, Česko"
  short_desc: "Během víkendovky jsme se vydali do Čížova, kde jsme opravovali vesmírnou loď, bojovali s meči na poli, grillovali a měli jsme účastnické přednášky. Nakonec jsme se vydali na výlet do Národního parku Podyjí, kde jsme si užili krásnou přírodu a výhledy."
  photo: "/img/events/cizov.jpg"

- title: "Norsko 2023"
  country: "no"
  date: "Listopad 2023"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Trondheim, Norsko"
  short_desc: "Během víkendovky jsme se vydali do Norska, kde jsme navštívili Trondheim a jeho univerzitu. Dále jsme se vydali na výlet do hor, kde jsme si užili krásné výhledy a přírodu. Během pobytu jsme také hráli různé hru na poznání Trondheimu, noční šifrovací hru a krátkou běhačku s tematikou boje o topenáře."
  photo: "/img/events/norsko.jpg"

- title: "Maďarsko 2023"
  country: "hu"
  date: "Březen 2023"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Rajka, Maďarsko"
  short_desc: "V průběhu celé akce jsme vařili z chilli, přičemž se účastníci přesouvali mezi objekty, podle toho, kde se zrovna vařilo. Během noční hry jsme navštívili trojmezí Maďarska, Slovenska a Rakouska. Na závěr jsme se vydali do Budapešti, kde jsme si prohlédli město a obdivovali místní toalety."
  photo: "/img/events/bdsm.jpg"

- title: "Německo 2022"
  country: "de"
  date: "Říjen 2022"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Mnichov, Německo"
  short_desc: "Druhou víkendovku jsme započali v Plzni, kde jsme zahájili program velkou spoustou přednášek. Hned druhý den ráno jsme se vydali do německého Mnichova, kde jsme kromě prohlídky města stihli během noční hry zabránit ochrance, která nám násilně narvala špunty do uší. Celou akci jsme zakončili strategickým soubojem o Poštovní planetu."
  photo: "/img/events/nemci.png"

- title: "Česko 2022"
  country: "cz"
  date: "Březen 2022"
  status: "yellow"
  status_label: "Proběhlo"
  location: "Růžená, Česko"
  short_desc: "Naše první víkendovka. Bydleli jsme na chatě na Vysočině, kde jsme hráli hry, např bombu, zkusili si virtuální realitu, hráli si s elektronikou a dělali chemické pokusy. Seznamovali jsme se s teorií kategorií a bojovali proti viru imperativního programování."
  photo: "/img/events/cesko.png"
