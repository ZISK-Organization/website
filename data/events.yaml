- title: "Polsko 2025"
  date: "Listopad 2025"
  status: "blue"
  status_label: "Proběhlo"
  location: "Wieprz, Polsko"
  short_desc: "Vyrazili jsme do polských Beskyd, kde jsme zjistili, že je tam pořád smog. Ústředním motivem byly experimenty s ohněm na různé způsoby, od pečení crema catalana, přes hořící těstoviny a marshmallows, až po dělání popcornu. Během toho jsme se učili, jak vyrobit Molotovův koktejl a provedli jsme páté dělení Polska."
  photo: "/img/events/polsko.jpg"

